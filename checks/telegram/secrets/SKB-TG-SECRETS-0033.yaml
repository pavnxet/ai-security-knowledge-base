id: SKB-TG-SECRETS-0033
title: Telegram bot token kept secret and rotatable
summary: The bot token is a full-access credential; never ship or commit it.
platforms:
- telegram
stacks:
- any
domain: secrets
phase:
- pr-review
- pre-launch
- full-audit
severity: critical
priority: 70
cwe:
- CWE-798
owasp: []
check: Confirm the bot token is loaded from env/secret store, never in client code or git; the token format
  is <bot_id>:<35-char secret>.
fix: Store the token in a secret manager; revoke via BotFather if leaked; never expose it to Mini Apps.
detect:
  grep:
  - api.telegram.org/bot
  - BOT_TOKEN
  - '[0-9]{8,10}:[A-Za-z0-9_-]{35}'
  files:
  - '**/*.py'
  - '**/*.js'
  - '**/*.ts'
  - '**/*.env'
verify_evidence: Cite the file:line or config value inspected to justify pass/fail, or mark unknown.
tags:
- telegram
- secrets
sources:
