id: SKB-DESK-UPDATE-0048
title: Electron uses a current version and validated updates
summary: Keep Electron current; verify update integrity.
platforms:
- desktop
stacks:
- any
domain: supply-chain
phase:
- pr-review
- pre-launch
- full-audit
severity: high
priority: 45
cwe:
- CWE-1104
owasp: []
check: Confirm Electron is a current release (older versions carry nodeIntegration-bypass CVEs) and the
  updater validates signatures over HTTPS.
fix: Update Electron; sign releases; verify signatures before install.
detect:
  grep:
  - electron
  - autoUpdater
  - setFeedURL
  files:
  - '**/package.json'
  - '**/main*.js'
verify_evidence: Cite the file:line or config value inspected to justify pass/fail, or mark unknown.
