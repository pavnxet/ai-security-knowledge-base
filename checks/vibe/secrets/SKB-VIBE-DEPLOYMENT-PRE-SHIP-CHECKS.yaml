id: SKB-VIBE-DEPLOYMENT-PRE-SHIP-CHECKS
title: Pre-Ship Checks
summary: 'Pre-Ship Checks Before deploying: - Run gitleaks detect on your repo to scan for leaked secrets
  in git history - Verify .env files are in .g'
platforms:
- vibe
stacks:
- any
domain: secrets
phase:
- pr-review
- pre-launch
- full-audit
severity: high
priority: 55
cwe:
- CWE-798
cwe_source: mapped
owasp:
- VIBE:deployment#Pre-Ship Checks
refs:
- VIBE:deployment#Pre-Ship Checks
check: 'Pre-Ship Checks Before deploying: - Run gitleaks detect on your repo to scan for leaked secrets
  in git history - Verify .env files are in .gitignore - Confirm debug mode / verbose logging is disabled
  - Check that error pages don''t leak stack traces'
fix: 'See raroque/vibe-security-skill vibe-security/references/deployment.md (anchor: Pre-Ship Checks)
  for remediation.'
detect:
  grep:
  - AKIA[0-9A-Z]{16}
  - api[_-]?key
  - password\s*=
  - '-----BEGIN'
  files:
  - '**/*.env'
  - '**/*.yml'
  - '**/*.py'
  - '**/*.js'
verify_evidence: Cite the file:line or config value inspected to justify pass/fail, or mark unknown.
tags:
- secrets
- ship
- checks
