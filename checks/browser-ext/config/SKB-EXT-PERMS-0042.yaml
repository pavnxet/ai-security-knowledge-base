id: SKB-EXT-PERMS-0042
title: Extension requests minimal permissions
summary: MV3 extensions should register only needed APIs and host permissions.
platforms:
- browser-ext
stacks:
- any
domain: config
phase:
- pr-review
- pre-launch
- full-audit
severity: high
priority: 50
cwe:
- CWE-250
owasp: []
check: Review manifest permissions/host_permissions; flag broad ones (<all_urls>, webRequest) not justified
  by features.
fix: Trim to least privilege; use optional_permissions and activeTab; narrow host patterns.
detect:
  grep:
  - permissions
  - host_permissions
  - <all_urls>
  files:
  - '**/manifest.json'
verify_evidence: Cite the file:line or config value inspected to justify pass/fail, or mark unknown.
tags:
- extension
- permissions
