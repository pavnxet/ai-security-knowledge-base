id: SKB-BASE-12-SSRF-VIA-OUTBOUND-HTTP
title: 12. SSRF via outbound HTTP
summary: '12. SSRF via outbound HTTP What: axios / fetch to user-supplied URLs can hit internal metadata
  endpoints ( 169.254.169.254 ). Fix: Allowlist'
platforms:
- web
- api
stacks:
- any
domain: ssrf
phase:
- pr-review
- pre-launch
- full-audit
severity: high
priority: 55
cwe:
- CWE-918
cwe_source: mapped
owasp:
- BASE:12. SSRF via outbound HTTP
refs:
- BASE:12. SSRF via outbound HTTP
check: '12. SSRF via outbound HTTP What: axios / fetch to user-supplied URLs can hit internal metadata
  endpoints ( 169.254.169.254 ). Fix: Allowlist outbound hosts; block link-local and RFC1918 ranges; validate
  URL schemes. Detection: rg -n "axios\.(get post)\(.'
fix: 'See yesmayank/secure-coding-baseline 01-nodejs-express.md (anchor: 12. SSRF via outbound HTTP) for
  remediation.'
detect:
  grep:
  - requests.get(
  - fetch(
  - axios(
  - urlopen
  files:
  - '**/*.py'
  - '**/*.js'
  - '**/*.go'
verify_evidence: Cite the file:line or config value inspected to justify pass/fail, or mark unknown.
tags:
- ssrf
- ssrf
- outbound
- http
