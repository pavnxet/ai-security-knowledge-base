[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-kb"
version = "0.9.0"
description = "AI security knowledge base: security check cards for AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "secure-kb contributors" }]
keywords = ["security", "appsec", "owasp", "checklist", "ai-agent", "mcp"]
dependencies = []

[project.optional-dependencies]
build = ["jsonschema>=4", "pyyaml>=6"]
dev = ["jsonschema>=4", "pyyaml>=6", "pytest"]

[project.scripts]
secure-kb = "secure_kb:main"

[project.urls]
Homepage = "https://github.com/pavnxet/ai-security-knowledge-base"
Repository = "https://github.com/pavnxet/ai-security-knowledge-base"
Documentation = "https://pavnxet.github.io/ai-security-knowledge-base/"

[tool.setuptools]
package-dir = { "" = "cli" }
py-modules = ["secure_kb"]
