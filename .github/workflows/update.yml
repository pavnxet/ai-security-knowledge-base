name: monthly-source-refresh

on:
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema requests
      - name: Re-resolve source SHAs / licenses (writes sources.yaml)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_sources.py
      - name: Open a pull request if sources changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- sources.yaml; then
            echo "no source changes"
            exit 0
          fi
          branch="chore/source-refresh-$(date -u +%Y-%m-%d)"
          git config user.name "secure-kb-bot"
          git config user.email "bot@secure-kb.local"
          git checkout -b "$branch"
          git add sources.yaml
          git commit -m "chore(sources): monthly refresh $(date -u +%F)"
          git push -u origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore(sources): monthly refresh $(date -u +%F)" \
            --body "Automated monthly re-resolve of source SHAs and licences. Every changed field is listed in the job log; review the diff before merging."
          echo "::notice::sources.yaml changed - a pull request was opened for review"
