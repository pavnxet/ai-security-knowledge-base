name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# One run per branch; a newer push cancels superseded queued/in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install pyyaml jsonschema pytest
      - name: Unit tests (CLI + MCP)
        run: python -m pytest tests/ -q
      - name: Validate cards (schema, token limits, coverage, provenance, licences)
        run: python tests/validate.py
      - name: Held-out benchmark (report)
        run: python bench/run_bench.py
      - name: Benchmark regression gate
        run: python bench/gate.py
      - name: CLI smoke test
        run: |
          python cli/secure_kb.py detect .
          python cli/secure_kb.py profile web --gate fast --format brief | head -5
          python cli/secure_kb.py get SKB-ASVS-V1-2-4 --format md | head -5
      - name: Zero-dependency fallback works (sharded index, no build step)
        run: |
          cat index/checks/*.jsonl | jq -c 'select(.severity=="critical") | {id,title}' | head -3
          cat index/checks/*.jsonl | grep -c "SKB-ASVS"
          cut -f1,2 index/brief.tsv | head -3

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install pyyaml
      - name: Rebuild from pinned sources and compare content_hash to committed manifest
        run: |
          python scripts/fetch_sources.py
          python scripts/ingest_from_cache.py
          python scripts/build_cards_v2.py
          python scripts/build_authored.py
          python scripts/dedupe.py
          python scripts/build_index.py
          python scripts/phase_d.py
          python scripts/build_index.py
          python - <<'PY'
          import json
          rebuilt=json.load(open("manifest.json"))["content_hash"]
          committed=json.load(open("manifest.committed.json"))["content_hash"]
          print("rebuilt", rebuilt, "committed", committed)
          assert rebuilt==committed, "content_hash mismatch: build is not reproducible"
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          curl -sSL https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.2/trufflehog_3.99.2_linux_amd64.tar.gz | tar xz trufflehog
      - name: gitleaks - working tree + history (gated by an explicit FP-shape filter)
        run: |
          ./gitleaks dir --config .gitleaks.toml --report-format json --report-path gl-dir.json . || true
          python3 scripts/gitleaks_report.py gl-dir.json
          ./gitleaks git --config .gitleaks.history.toml --report-format json --report-path gl-git.json . || true
          python3 scripts/gitleaks_report.py gl-git.json
      - name: canary - the allowlist must NOT blind gitleaks
        run: |
          printf 'aws_access_key_id = AKIA%s\n' "QWERTYUIOPASDFGH" > canary_secret.txt
          ./gitleaks dir --config .gitleaks.toml --report-format json --report-path gl-canary.json . || true
          if python3 scripts/gitleaks_report.py gl-canary.json; then
            echo "CANARY FAILED: gitleaks did not flag the fake secret - allowlist is too broad"; exit 1
          else
            echo "CANARY OK: gitleaks flagged the fake secret"
          fi
          rm -f canary_secret.txt
      - name: trufflehog - filesystem (report-only)
        run: |
          ./trufflehog filesystem . --no-verification --json --exclude-paths .trufflehog-exclude.txt > th.jsonl 2>/dev/null || true
          echo "trufflehog findings (report-only; gitleaks is the gating scanner): $(wc -l < th.jsonl)"
          python3 scripts/trufflehog_report.py th.jsonl || true
