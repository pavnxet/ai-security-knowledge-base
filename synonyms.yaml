# synonyms.yaml — developer-vocabulary expansion for free-text search.
# Each key expands a query term to its aliases; retrieval ORs the expanded terms.
version: 1
synonyms:
  xss: [cross-site scripting, cross site scripting, script injection]
  sqli: [sql injection, sql-injection, sql]
  nosql: [nosql injection, mongodb injection]
  jwt: [json web token, json web tokens, bearer token]
  oauth: [openid connect, oidc]
  idor: [insecure direct object reference, broken object level authorization, bola, object authorization]
  bfla: [broken function level authorization, function authorization, privilege escalation]
  ssrf: [server side request forgery, server-side request forgery, url fetch]
  csrf: [cross-site request forgery, xsrf, anti-forgery token]
  rce: [remote code execution, command execution]
  lfi: [local file inclusion, path traversal, directory traversal]
  xxe: [xml external entity, xml entity]
  deserialization: [insecure deserialization, unsafe deserialization, pickle, unserialize]
  cors: [cross origin resource sharing, cross-origin resource sharing]
  csp: [content security policy]
  hsts: [strict transport security, http strict transport security]
  mfa: [multi-factor authentication, 2fa, two factor, second factor]
  sso: [single sign on, single sign-on]
  pii: [personally identifiable information, personal data, sensitive data]
  rls: [row level security, row-level security, row security]
  sca: [software composition analysis, dependency scanning, vulnerable dependencies]
  sast: [static application security testing, static analysis]
  dast: [dynamic application security testing, dynamic analysis]
  ratelimit: [rate limiting, rate limit, throttling, brute force, flood control]
  upload: [file upload, unrestricted upload, file upload validation]
  webhook: [callback, secret_token, webhook signature, hmac]
  secrets: [api key, api keys, credentials, hardcoded secret, token leak, env]
  slopsquat: [slopsquatting, hallucinated package, package hallucination, typosquat]
  ats: [app transport security, ios network]
  ipc: [inter-process communication, interprocess communication, electron ipc]
  k8s: [kubernetes, container orchestration, pod security]
  iac: [infrastructure as code, terraform, misconfiguration]
  iam: [identity and access management, least privilege, permissions]
  reentrancy: [reentrant, reentrancy guard]
  oracle: [price oracle, price manipulation, twap]
  promptinjection: [prompt injection, jailbreak, instruction override]
  agency: [excessive agency, tool permissions, agent permissions]

# topic hubs: a topic -> extra terms appended when the query hits the topic keyword
topic_hubs:
  authentication: [login, password, session, mfa, jwt, oauth, credential]
  authorization: [access control, idor, bola, bfla, permissions, least privilege]
  injection: [sqli, nosql, xss, command injection, lfi, xxe, template injection]
  cryptography: [tls, hashing, encryption, key management, certificate]
  secrets: [api key, token, credential, env, vault]
  supply-chain: [dependency, sca, sbom, package, slopsquat]
  mobile: [android, ios, keystore, keychain, webview]
  cloud: [iam, s3, kubernetes, container, serverless, iac]
  llm: [prompt injection, output handling, agency, embeddings]
  telegram: [bot token, webhook, initData, admin command]
